{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – HAIDWARE</title>
  <link rel="stylesheet" href="{% static 'portal/portal.css' %}?v=3">
</head>
<body class="login-page">
  <form class="login-card" method="post">
    {% csrf_token %}
    <span class="brand-mark">H</span>
    <h1>HAIDWARE</h1>
    <p>Hospitality Operations Platform</p>
    {% if form.errors %}<div class="message error">Username or password is incorrect.</div>{% endif %}
    <label for="{{ form.username.id_for_label }}">Username</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button primary full" type="submit">Sign In</button>
    <a class="login-signup-link" href="{% url 'manager_signup' %}">Manager / Director sign up</a>
    <small>HAIDWARE Hospitality © {% now "Y" %}</small>
  </form>
</body>
</html>
