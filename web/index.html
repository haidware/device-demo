<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Order food and hotel services with Haidware Hospitality.">
  <meta name="theme-color" content="#080A0E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Haidware">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="application-name" content="Haidware">
  <meta name="msapplication-TileColor" content="#080A0E">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Haidware Hospitality</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-content">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Opening your room...</span>
    </div>
  </div>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #080a0e;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #080a0e;
      color: #d8c29a;
      font: 14px system-ui, sans-serif;
      letter-spacing: 0.04em;
    }

    .loading-content {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(198, 164, 109, 0.24);
      border-top-color: #c6a46d;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
  <script>
    window.addEventListener(
      'flutter-first-frame',
      function () {
        const loader = document.getElementById('app-loading');
        if (loader) {
          loader.remove();
        }
      },
      { once: true },
    );
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
